name: Build imagens Docker (GHCR)

# Builda as imagens da api/ e do web/ nos servidores do GitHub e publica no
# GHCR. O Dokploy só puxa a imagem pronta — o VPS não builda nada.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/yt-analise-canais-api:latest
            ghcr.io/${{ github.repository_owner }}/yt-analise-canais-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_API_URL é inlined no bundle do Next em build time.
      # Se a URL da API mudar, atualizar aqui e rebuildar.
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://youtube-analyzer-api.duckdns.org
          tags: |
            ghcr.io/${{ github.repository_owner }}/yt-analise-canais-web:latest
            ghcr.io/${{ github.repository_owner }}/yt-analise-canais-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
